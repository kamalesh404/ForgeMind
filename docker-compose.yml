version: "3.8"

services:
  forgemind:
    build: .
    ports:
      - "8080:8080"
    environment:
      FORGEMIND_HOST: "0.0.0.0"
      FORGEMIND_PORT: "8080"
      FORGEMIND_BACKEND: "ollama"
      FORGEMIND_MODEL: "qwen2.5-coder:7b"
    volumes:
      - forgemind-data:/app/.forgemind
    restart: unless-stopped

volumes:
  forgemind-data:
